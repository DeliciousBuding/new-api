name: Sync main from upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch for workflow context
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Fetch upstream and sync main
        shell: bash
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo '::error::UPSTREAM_SYNC_TOKEN secret is not set'
            exit 1
          fi

          git remote add official https://github.com/QuantumNous/new-api.git 2>/dev/null || \
            git remote set-url official https://github.com/QuantumNous/new-api.git
          git fetch --quiet official '+refs/heads/main:refs/remotes/official/main'

          UPSTREAM_HEAD=$(git rev-parse refs/remotes/official/main)
          CURRENT_MAIN=$(git rev-parse refs/remotes/origin/main 2>/dev/null || echo "")

          echo "Upstream main: $UPSTREAM_HEAD"
          echo "Current main:  $CURRENT_MAIN"

          if [ "$CURRENT_MAIN" = "$UPSTREAM_HEAD" ]; then
            echo '::notice::main is already in sync with upstream — no action needed.'
            exit 0
          fi

          # Push the upstream ref directly instead of checking out a local
          # `main` branch: with both `origin/main` and `official/main` present,
          # `git checkout main` is ambiguous and fails with exit 128.
          git push "https://x-access-token:${UPSTREAM_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/remotes/official/main:refs/heads/main --force

          {
            echo "### Upstream sync result"
            echo
            echo "- upstream main head: \`$UPSTREAM_HEAD\`"
            echo "- previous main: \`$CURRENT_MAIN\`"
            echo "- action: main reset to upstream and force-pushed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open tracking issue on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="upstream-sync failed — main mirror drift"
          BODY="The scheduled upstream sync failed.

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Consequence: \`main\` is not a current mirror of QuantumNous/new-api.

          Fix the workflow or resolve the failure, then re-run it manually."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$TITLE\"" --state open --limit 1 --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
