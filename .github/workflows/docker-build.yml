name: CD - TokenDance Gateway

on:
  push:
    tags:
      - "v*-td-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable TokenDance release tag"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tokendancelab/new-api

jobs:
  verify-release:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify immutable release source
        shell: bash
        run: .github/scripts/verify-td-release.sh '${{ steps.version.outputs.tag }}'

      - name: Upload source manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tokendance-release-source
          path: tokendance-release-source.json
          if-no-files-found: error

  verify-backend:
    name: Backend vet, build, and test
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

  verify-frontend:
    name: Frontend typecheck, test, and build
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  build-and-push:
    name: Build and push amd64 image
    needs: [verify-release, verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to rebuild an already published tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Image '$IMAGE_NAME:$RELEASE_TAG' already exists. Use a new tag."
            exit 1
          fi
          echo "::notice::Tag '$RELEASE_TAG' has no published image yet; proceeding."

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.verify-release.outputs.tag }}
            type=sha,prefix=sha-,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tokendance-gateway-amd64
          cache-to: type=gha,mode=max,scope=tokendance-gateway-amd64
          provenance: mode=max
          sbom: true

      - name: Image summary
        shell: bash
        run: |
          {
            echo '### TokenDance Gateway image'
            echo
            echo '```text'
            echo '${{ env.IMAGE_NAME }}:${{ needs.verify-release.outputs.tag }}'
            echo '${{ steps.build.outputs.digest }}'
            echo '```'
            echo
            echo 'Production deployment is intentionally out of scope for this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish GitHub Release
    needs: [verify-release, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download source manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tokendance-release-source

      - name: Complete release manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("tokendance-release-source.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["image"] = os.environ["IMAGE_NAME"]
          payload["oci_index_digest"] = os.environ["IMAGE_DIGEST"]
          payload["workflow_run_id"] = os.environ["GITHUB_RUN_ID"]
          payload["workflow_run_attempt"] = os.environ["GITHUB_RUN_ATTEMPT"]
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create immutable GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.verify-release.outputs.tag }}
          name: TokenDance Gateway ${{ needs.verify-release.outputs.tag }}
          generate_release_notes: true
          make_latest: false
          files: tokendance-release-source.json
