name: CD - DeepSeek Relay

on:
  push:
    tags:
      - "v*-sgp2-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v1.0.0-sgp2-20260801.2)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tokendancelab/deepseek-relay

jobs:
  build-and-push:
    name: Build and push amd64 image
    runs-on: [self-hosted, Linux, X64, sgp2]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          fi
          case "$TAG" in
            v*-sgp2-*) ;;
            *) echo "::error::Tag '$TAG' is not an sgp2 release"; exit 1 ;;
          esac
          printf '%s\n' "$TAG" > VERSION
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Refuse to rebuild an already published tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # Candidate tags are immutable. This guard applies to both tag pushes
          # and manual dispatches so rerunning either path cannot move a digest.
          if docker buildx imagetools inspect "$IMAGE_NAME:$TAG" >/dev/null 2>&1; then
            echo "::error::Image '$IMAGE_NAME:$TAG' already exists. Use a new tag for rebuilt candidates."
            exit 1
          fi
          echo "::notice::Tag '$TAG' has no published image yet; proceeding."

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=DeepSeek Relay
            org.opencontainers.image.description=Independent DeepSeek API relay based on new-api
            org.opencontainers.image.source=https://github.com/TokenDanceLab/new-api

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sgp2-deepseek-relay-amd64
          cache-to: type=gha,mode=max,scope=sgp2-deepseek-relay-amd64
          provenance: mode=max
          sbom: true

      - name: Image summary
        shell: bash
        run: |
          {
            echo '### DeepSeek Relay image'
            echo
            echo '```text'
            echo '${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}'
            echo '${{ steps.build.outputs.digest }}'
            echo '```'
            echo
            echo 'Production deployment is intentionally out of scope for this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
