name: CD - TokenDance Gateway

on:
  push:
    tags:
      - 'v*-td-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.0.0-rc.22-td-20260727)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tokendancelab/new-api

jobs:
  build-and-push:
    name: Build and push amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          fi
          case "$TAG" in
            v*-td-*) ;;
            *) echo "::error::Tag '$TAG' is not a TokenDance release"; exit 1 ;;
          esac
          printf '%s\n' "$TAG" > VERSION
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=sha-,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tokendance-gateway-amd64
          cache-to: type=gha,mode=max,scope=tokendance-gateway-amd64
          provenance: mode=max
          sbom: true

      - name: Image summary
        shell: bash
        run: |
          {
            echo '### TokenDance Gateway image'
            echo
            echo '```text'
            echo '${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}'
            echo '${{ steps.build.outputs.digest }}'
            echo '```'
            echo
            echo 'Production deployment is intentionally out of scope for this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
