name: Check upstream release

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

concurrency:
  group: upstream-check-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out TokenDance source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Compare fixed base with official upstream
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(tr -d '\r\n' < UPSTREAM_BASE)
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::UPSTREAM_BASE must contain one 40-character lowercase SHA'
            exit 1
          fi

          git remote add official https://github.com/QuantumNous/new-api.git 2>/dev/null || \
            git remote set-url official https://github.com/QuantumNous/new-api.git
          # Dual channel: official main branch (primary signal) plus release
          # tags. New fixes often land on main without a tag, so tag-only
          # comparison would miss them (e.g. #6518/#6570).
          git fetch --quiet official '+refs/heads/main:refs/remotes/official/main'
          git fetch --quiet official '+refs/tags/*:refs/remotes/official/tags/*'
          MAIN_HEAD=$(git rev-parse refs/remotes/official/main)
          MAIN_BEHIND=$(git rev-list --count "$BASE..$MAIN_HEAD" 2>/dev/null || echo '?')
          mapfile -t TAGS < <(
            git for-each-ref --sort=-version:refname \
              --format='%(refname:strip=4)' refs/remotes/official/tags
          )
          LATEST_TAG=''
          for TAG in "${TAGS[@]}"; do
            if [[ ! "$TAG" =~ (-alpha|-nightly|-td[.-]) ]]; then
              LATEST_TAG="$TAG"
              break
            fi
          done
          LATEST_TAG_SHA=''
          if [ -n "$LATEST_TAG" ]; then
            LATEST_TAG_SHA=$(git rev-parse "refs/remotes/official/tags/$LATEST_TAG^{}")
          fi
          {
            echo '### Upstream status'
            echo
            echo "- fixed base: \`$BASE\`"
            echo "- official main head: \`$MAIN_HEAD\`"
            echo "- commits behind official main: \`$MAIN_BEHIND\`"
            echo "- latest official tag: \`${LATEST_TAG:-none}\`"
            echo "- latest official commit: \`${LATEST_TAG_SHA:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BASE" != "$MAIN_HEAD" ]; then
            echo '::warning::Official main has moved ahead of the fixed base; rebuild from the new base and replay the topic commits.'
          fi

