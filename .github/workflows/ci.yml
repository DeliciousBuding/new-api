name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
  # No paths-ignore on pull_request: dev enforces required status checks,
  # and a skipped workflow leaves those checks pending forever on docs-only PRs.
  # push only on dev: main is the upstream mirror, force-synced by
  # upstream-sync.yml, and would burn a full CI run on every sync for no
  # consumer.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify toolchain
        run: |
          go version
          make --version | head -1

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

  frontend:
    name: Frontend typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Verify toolchain
        run: |
          bun --version
          node --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
